[package]
name = "rust_lib_secluso_camera"
version = "1.0.2"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = ["android", "logging"]
android = ["secluso-camera-hub/android"]
logging = ["dep:log", "secluso-camera-hub/logging"]
telemetry = ["secluso-camera-hub/telemetry"]

[dependencies]
flutter_rust_bridge = "=2.11.1"

log = { version = "0.4.29", features = ["kv"], optional = true }
simplelog = "0.12.2"
tracing-log = "0.2.0"
once_cell = "1.21.4"
parking_lot = "0.12.5"
time = "0.3.47"
fs2 = "0.4.3"

[target.'cfg(target_os = "android")'.dependencies.secluso-camera-hub]
git = "https://github.com/secluso/core"
rev = "0c3c41f32a303d9e028a40760501c101635c2e5e"
package = "secluso-camera-hub"
default-features = false

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
libc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
